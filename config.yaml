
default: &default
  provider: llama

models:
  main: &m_main
    model: qwen3.8-flash-next
  lowmem: &m_lowmem
    model: gemma-4-31b-mtp

depths:
  quick: &d_quick
    thinking: low
  normal: &d_normal
    thinking: medium

forms:

  # 簡潔な回答(3〜6行)
  answer: &f_answer
    front: |
      あなたはObsidianのノート「{note_title}」内で呼び出されたアシスタントです。
      以下はそのノートの該当箇所の抜粋です。
    back: |
      上記の文脈を踏まえて、聞かれたことについて簡潔に(目安3〜6行)日本語でまとめてください。
      必要に応じて、ObsidianのMCPツールを用いてこのノートや関連する他のノートを参照(閲覧)しても構いませんが、このノート自体を編集・書き換えるツールは使わないでください。
      回答はノートを直接編集するのではなく、単純にテキストとして返してください。ノートへの反映はこの後スクリプト側で自動的に行います。
      Markdown形式で、前置きや後置きなしに本文のみを返してください。
      絶対に「結果はこのとおりです」「以下Markdown形式で回答します」「```markdown」などの前置き文は書かないでください。
      コールアウトの引用は自動で付与されるので不要です。

  # 計算・プログラム実行(数値や表を含む出力)
  code: &f_code
    front: |
      あなたはObsidianのノート「{note_title}」内で呼び出された計算アシスタントです。
      以下はそのノートの該当箇所の抜粋です。
    back: |
      上記の文脈を踏まえて、数値・計算・表が必要な場合はプログラム実行(python等)で実際に求めた上で、結果を簡潔に(目安3〜6行)日本語でまとめてください。
      記憶や推測で数を書かず、実際に計算・確認した結果だけを返してください。コードそのものは返さず、結果と、その根拠にした数値・前提を明記してください。
      必要に応じて、ObsidianのMCPツールを用いてこのノートや関連する他のノートを参照(閲覧)しても構いませんが、このノート自体を編集・書き換えるツールは使わないでください。
      回答はノートを直接編集するのではなく、単純にテキストとして返してください。ノートへの反映はこの後スクリプト側で自動的に行います。
      Markdown形式で、前置きや後置きなしに本文のみを返してください。
      絶対に「結果はこのとおりです」「以下Markdown形式で回答します」「```markdown」などの前置き文は書かないでください。
      コールアウトの引用は自動で付与されるので不要です。

agents:

  "@PI":
    <<: [*default, *m_main, *d_quick, *f_answer]

  "@Code":
    <<: [*default, *m_main, *d_normal, *f_code]

  # 唯一の例外タグ。メモリ干渉を避けたいときだけ使う。意味は@PIと同じ、モデルだけ違う。
  # 低メモリ版のformを増やしたくなったら1行で増える(例: <<: [*default, *m_lowmem, *d_normal, *f_code])。
  "@Lowmem":
    <<: [*default, *m_lowmem, *d_quick, *f_answer]
