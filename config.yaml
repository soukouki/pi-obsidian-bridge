# ============================================================
# Pi Obsidian Bridge の設定
# ============================================================
#
# app.py が読み取るのは agents と default の2つだけである。
# default に書けるのは front / back / plain_output / cwd の4項目で、
# agents で省略した項目はここから継承される。
# model / thinking / provider / aliases は default からは継承されないため、
# 各エージェントに書くか、下の profiles を参照する。

default:

  # プロンプト。{note_title} はノートの名前に置き換わる。
  front: |
    あなたはObsidianのノート「{note_title}」内で呼び出されたアシスタントです。
    以下はそのノートの該当箇所の抜粋です。

  back: |
    上記の文脈を踏まえて、聞かれたことについて簡潔に(目安3〜6行)日本語でまとめてください。
    必要に応じて、ObsidianのMCPツールを用いてこのノートや関連する他のノートを参照(閲覧)しても構いませんが、このノート自体を編集・書き換えるツールは使わないでください。
    回答はノートを直接編集するのではなく、単純にテキストとして返してください。ノートへの反映はこの後スクリプト側で自動的に行います。
    Markdown形式で、前置きや後置きなしに本文のみを返してください。
    絶対に「結果はこのとおりです」「以下Markdown形式で回答します」「```markdown」などの前置き文は書かないでください。
    回答をコールアウト(`>` 引用)で囲まないでください。引用を付けるかどうかはスクリプト側が決めます。

  # 最終結果の書き戻し形式。false は callout(`> [!note]`)、true は地の文。
  # 処理中の経過表示は常に callout で、最終結果をその部分で置き換えるときにこの設定にしたがう。
  # エラー時の書き戻しは視認性のため callout のまま。
  plain_output: false

  # Pi側のプロジェクト(作業ディレクトリ)の絶対パス。Pi側で存在する必要がある。
  # 保管庫のパスではない。存在しなければセッション作成がHTTP 400になる。
  # ここを省略すると環境変数 PI_CWD が使われる。
  cwd: /workspace

# model / thinking / provider を1回だけ定義して参照するためのアンカー。
# ここがアンカーを使う唯一の場所である。app.py はこのセクションそのものを読まない。
profiles:
  main: &main
    provider: llama
    model: qwen3.8-flash-next
    thinking: low

agents:

  # 1. 最もシンプルな形。プロンプトと plain_output は default から継承し、
  #    model / thinking / provider は profiles から参照する。
  "@PI":
    <<: *main
    aliases:
      - "@Assistant"        # 同じエージェントを別のタグでも呼べる

  # 2. 上書きの例。明示的に書いた項目はアンカーで継承した値より優先される。
  #    思考レベルを上げ、プロンプトだけ全文で書き換える。
  "@Code":
    <<: *main
    thinking: medium
    # このエージェントだけ Pi 側のプロジェクトを変える例。Pi側に存在するパスにすること。
    # cwd: /workspace/code
    back: |
      上記の文脈を踏まえて、数値・計算・表が必要な場合はプログラム実行(python等)で実際に求めた上で、結果を簡潔に(目安3〜6行)日本語でまとめてください。
      記憶や推測で数を書かず、実際に計算・確認した結果だけを返してください。コードそのものは返さず、結果と、その根拠にした数値・前提を明記してください。
      必要に応じて、ObsidianのMCPツールを用いてこのノートや関連する他のノートを参照(閲覧)しても構いませんが、このノート自体を編集・書き換えるツールは使わないでください。
      回答はノートを直接編集するのではなく、単純にテキストとして返してください。ノートへの反映はこの後スクリプト側で自動的に行います。
      Markdown形式で、前置きや後置きなしに本文のみを返してください。
      絶対に「結果はこのとおりです」「以下Markdown形式で回答します」「```markdown」などの前置き文は書かないでください。
      回答をコールアウト(`>` 引用)で囲まないでください。引用を付けるかどうかはスクリプト側が決めます。

  # 3. 地の文で書き戻す例。プロンプトは default をそのまま使う。
  "@Plain":
    <<: *main
    plain_output: true

  # 4. profiles を参照せず直接書く例。別のモデルを使いたいときはここだけ変える。
  "@Lowmem":
    provider: llama
    model: gemma-4-31b-mtp
    thinking: low
